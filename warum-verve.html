<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Warum Verve - Schreibsoftware aus eigener Autorenpraxis</title>
<meta name="description" content="Warum Verve entsteht: ein Autor baut eine macOS-Schreibsoftware aus eigener Schreibpraxis, damit Roman, Figuren, Orte, Plot und Notizen an einem Ort zusammenbleiben." />
<link rel="canonical" href="https://vervewriter.de/warum-verve.html" />
<meta property="og:type" content="website" />
<meta property="og:locale" content="de_DE" />
<meta property="og:site_name" content="Verve" />
<meta property="og:title" content="Warum Verve - aus echter Schreibpraxis" />
<meta property="og:description" content="Verve entsteht aus dem Wunsch, ein großes Werk zusammenzuhalten, ohne Figuren, Orte, Plot und Notizen ueberall doppelt zu pflegen." />
<meta property="og:url" content="https://vervewriter.de/warum-verve.html" />
<meta name="twitter:card" content="summary" />
<link rel="stylesheet" href="styles/site.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="src/chrome.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "dark",
  "accent": "bordeaux"
}/*EDITMODE-END*/;

function WarumVervePage() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  React.useEffect(() => { applyTheme(tweaks); }, [tweaks]);

  return (<>
    <SiteNav active="warum-verve.html" />

    <section className="page-hero why-hero">
      <div className="container-narrow">
        <span className="eyebrow eyebrow-line">Warum Verve</span>
        <h1>Gebaut aus<br/><em>echtem</em> Schreiben.</h1>
        <p className="lede">Verve entsteht, weil ich selbst schreibe und eine Werkstatt wollte, die ein großes Manuskript zusammenhält, ohne Figuren, Orte, Plot und Notizen überall doppelt zu pflegen.</p>
      </div>
    </section>

    <section className="why-section">
      <div className="container why-grid">
        <article className="why-copy">
          <span className="eyebrow">Der Ursprung</span>
          <h2>Eine Welt. Nicht zehn Ablagen.</h2>
          <p>Beim Roman wächst alles gleichzeitig: Szenen, Figuren, Orte, Nebenhandlungen, Recherche, lose Ideen. Irgendwann steht dasselbe Wissen in Notizen, Tabellen, Dokumenten und im Kopf. Verve soll genau diese Reibung kleiner machen.</p>
          <p>Die App ist deshalb keine abstrakte Produktidee, sondern ein Werkzeug aus meiner eigenen Schreibpraxis. Wenn mir beim Schreiben auffällt, dass etwas fehlt, wird daraus oft die nächste Verbesserung.</p>
        </article>

        <aside className="why-note">
          <div className="why-note-label">Beta</div>
          <p>Verve ist bewusst eine Vorabversion. Sie wächst mit echten Schreibsituationen und wird erst dann fertig genannt, wenn sie im Alltag eines langen Textes ruhig und verlässlich hilft.</p>
        </aside>
      </div>
    </section>

    <section className="why-band">
      <div className="container why-points">
        <div>
          <span className="eyebrow">Wofür</span>
          <h3>Werk-Wissen statt Zettelwirtschaft.</h3>
          <p>Figuren, Orte, Plot und Welt sollen nicht neben dem Manuskript existieren, sondern mit ihm verbunden bleiben.</p>
        </div>
        <div>
          <span className="eyebrow">Wie</span>
          <h3>Still im Hintergrund.</h3>
          <p>Verve soll nicht dauernd Aufmerksamkeit fordern. Es merkt sich Dinge, damit du beim Schreiben nicht aus dem Text fällst.</p>
        </div>
        <div>
          <span className="eyebrow">Warum Beta</span>
          <h3>Entwicklung am echten Text.</h3>
          <p>Die Beta ist kostenlos, weil sie noch wächst. Feedback und eigene Schreibpraxis entscheiden, was als Nächstes besser werden muss.</p>
        </div>
      </div>
    </section>

    <section className="why-section why-final">
      <div className="container-narrow">
        <span className="eyebrow eyebrow-line">Die Mission</span>
        <h2>Schreiben soll wieder wie Schreiben wirken.</h2>
        <p>Verve ist mein Versuch, die organisatorische Last langer Texte zu senken. Nicht, damit eine App wichtiger wird als der Roman, sondern damit der Roman weniger im Werkzeug verschwindet.</p>
        <div className="why-actions">
          <a href="index.html#download" className="btn-primary">Beta kostenlos laden</a>
          <a href="features.html" className="btn-ghost">Funktionen ansehen →</a>
        </div>
      </div>
    </section>

    <SiteFooter />

    <TweaksPanel title="Tweaks">
      <TweakSection title="Erscheinungsbild">
        <TweakRadio label="Modus" value={tweaks.theme} options={[{value:"dark",label:"Dunkel"},{value:"light",label:"Hell"}]} onChange={v => setTweak("theme", v)} />
        <TweakSelect label="Akzentfarbe" value={tweaks.accent} options={Object.entries(ACCENTS_SITE).map(([k,v]) => ({value:k,label:v.name}))} onChange={v => setTweak("accent", v)} />
      </TweakSection>
    </TweaksPanel>

    <style>{`
      .why-hero { padding-bottom: 72px; }
      .why-section {
        padding: 88px 0;
        border-bottom: 0.5px solid var(--rule);
      }
      .why-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 64px;
        align-items: start;
      }
      @media (max-width: 820px) { .why-grid { grid-template-columns: 1fr; gap: 32px; } }
      .why-copy h2,
      .why-final h2 {
        font-family: var(--serif);
        font-size: clamp(34px, 4.5vw, 56px);
        line-height: 1.06;
        letter-spacing: -0.03em;
        font-weight: 500;
        margin: 16px 0 24px;
      }
      .why-copy p,
      .why-final p {
        font-family: var(--serif);
        font-weight: 300;
        font-size: 19px;
        line-height: 1.6;
        color: var(--ink-dim);
        margin: 0 0 18px;
      }
      .why-note {
        border-top: 0.5px solid var(--rule-strong);
        border-bottom: 0.5px solid var(--rule);
        padding: 22px 0;
      }
      .why-note-label {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 12px;
      }
      .why-note p {
        color: var(--ink-dim);
        font-size: 14px;
        line-height: 1.65;
        margin: 0;
      }
      .why-band {
        padding: 72px 0;
        background: var(--bg-2);
        border-bottom: 0.5px solid var(--rule);
      }
      .why-points {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 32px;
      }
      @media (max-width: 820px) { .why-points { grid-template-columns: 1fr; } }
      .why-points h3 {
        font-family: var(--serif);
        font-weight: 500;
        font-size: 25px;
        line-height: 1.15;
        letter-spacing: -0.02em;
        margin: 12px 0 12px;
      }
      .why-points p {
        color: var(--ink-dim);
        font-size: 14px;
        line-height: 1.6;
        margin: 0;
      }
      .why-final {
        text-align: center;
        border-bottom: 0;
      }
      .why-final p { margin-left: auto; margin-right: auto; max-width: 58ch; }
      .why-actions {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 32px;
      }
    `}</style>
  </>);
}

function waitAndMount() {
  if (!window.SiteNav || !window.SiteFooter || !window.useTweaks) {
    return setTimeout(waitAndMount, 30);
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<WarumVervePage />);
}
waitAndMount();
</script>
</body>
</html>
