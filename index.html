// Render a mockup that scales to fit the showcase container
function ScaledMockup({ route, hideInspector, dark, accent }) {
  const wrapRef = React.useRef(null);
  const [scale, setScale] = React.useState(1);
  React.useEffect(() => {
    function update() {
      const el = wrapRef.current; if (!el) return;
      setScale(Math.min(1, (el.clientWidth - 32) / 1280));
    }
    update();
    window.addEventListener("resize", update);
    return () => window.removeEventListener("resize", update);
  }, []);
  return (
    <div ref={wrapRef} style={{padding: "0 16px"}}>
      <div style={{transform: `scale(${scale})`, height: 800 * scale, transformOrigin: "top center", width: 1280, margin: "0 auto"}}>
        <VerveApp route={route} hideInspector={hideInspector} dark={dark} accent={accent} />
      </div>
    </div>
  );
}

window.ScaledMockup = ScaledMockup;
function waitAndMount() {
  if (!window.VerveApp || !window.SiteNav || !window.RoutePlot || !window.useTweaks) {
    return setTimeout(waitAndMount, 30);
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<IndexPage />);
}
waitAndMount();
</script>
