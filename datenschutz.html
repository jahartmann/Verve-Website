<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Datenschutz - Verve bleibt lokal auf deinem Mac</title>
<meta name="description" content="Datenschutz bei Verve: keine Konten, keine Pflicht-Cloud, keine Telemetrie. Dein Manuskript und dein Werk-Wissen bleiben auf deinem Mac." />
<link rel="canonical" href="https://vervewriter.de/datenschutz.html" />
<meta property="og:type" content="website" />
<meta property="og:locale" content="de_DE" />
<meta property="og:site_name" content="Verve" />
<meta property="og:title" content="Verve Datenschutz - dein Text bleibt bei dir" />
<meta property="og:description" content="Keine Konten, keine Pflicht-Cloud, keine Telemetrie: Verve ist fuer lokale Schreibarbeit auf dem Mac gebaut." />
<meta property="og:url" content="https://vervewriter.de/datenschutz.html" />
<meta name="twitter:card" content="summary" />
<link rel="stylesheet" href="styles/site.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="src/chrome.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "dark",
  "accent": "bordeaux"
}/*EDITMODE-END*/;

function DatenschutzPage() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  React.useEffect(() => { applyTheme(tweaks); }, [tweaks]);

  return (<>
    <SiteNav active="datenschutz.html" />

    <section className="page-hero">
      <div className="container-narrow">
        <span className="eyebrow eyebrow-line">Datenschutz</span>
        <h1>Dein Text bleibt<br/>auf <em>deinem</em> Mac.</h1>
        <p className="lede">Keine Telemetrie. Keine Cloud-Pflicht. Keine Konten. Tatsächlich — nicht nur in einer FAQ, sondern im Quellcode, den du nachlesen kannst.</p>
      </div>
    </section>

    {/* Three pillars */}
    <section className="pill container">
      <PillCard title="Keine Telemetrie." body="Verve sendet keine Nutzungsdaten. Kein Crash-Reporting an einen externen Dienst. Keine Analytics. Wenn die App abstürzt, schreibt sie ein Log auf deine Platte — du entscheidest, ob du es teilst." />
      <PillCard title="Keine Konten." body="Es gibt keine Anmeldung. Keine E-Mail-Adresse, keine Cloud-Sync-Pflicht. Du lädst Verve, du öffnest sie, du schreibst." />
      <PillCard title="Keine Cloud-Pflicht." body="Standardmäßig läuft alles lokal — Editor, Werk-Wissen, KI. Cloud-Modelle sind ein Schalter, kein Standard. Bei Erstinstallation ist er aus." />
    </section>

    <SectionDivider eyebrow="Was bleibt wo" title="Datenfluss, in einem Bild." />

    {/* Data flow diagram */}
    <section className="flow container">
      <div className="flow-grid">
        <FlowNode title="Dein Mac" sub="Manuskript · Werk-Wissen · Index · Lokale KI" status="immer" highlight={true} />
        <FlowArrow label="Standard: nichts verlässt das Gerät" />
        <FlowNode title="Internet" sub="optional · nur wenn du Cloud-KI wählst" status="auf Wunsch" highlight={false} />
      </div>

      <div className="flow-detail">
        <div className="fdet-col">
          <h4>Bleibt immer auf deinem Mac</h4>
          <ul>
            <li>Vollständiges Manuskript</li>
            <li>Figuren, Orte, Zeitlinien, Notizen</li>
            <li>Versions-Historie und Backups</li>
            <li>Lokaler Vektor-Index (Embeddings)</li>
            <li>Stilprofil-Modell</li>
            <li>App-Einstellungen</li>
          </ul>
        </div>
        <div className="fdet-col">
          <h4>Geht ins Internet — wenn du es einschaltest</h4>
          <ul>
            <li>Bei Cloud-KI: 5–12 relevante Belegstellen pro Anfrage</li>
            <li>Bei Update-Prüfung: einmal täglich eine Versionsnummer</li>
            <li>Bei manuellem Export: was du exportierst, wohin du es exportierst</li>
          </ul>
          <p className="fdet-note">Niemals: vollständiges Manuskript, Figuren-Notizen, persönliche Daten, Telemetrie.</p>
        </div>
      </div>

      <style>{`
        .flow { padding: 60px 32px 100px; }
        .flow-grid {
          display: grid;
          grid-template-columns: 1fr auto 1fr;
          gap: 24px;
          align-items: center;
          max-width: 1100px;
          margin: 0 auto 64px;
        }
        @media (max-width: 720px) { .flow-grid { grid-template-columns: 1fr; } }
        .flow-detail {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 48px;
          max-width: 1000px;
          margin: 0 auto;
          padding: 48px 0 0;
          border-top: 0.5px solid var(--rule);
        }
        @media (max-width: 720px) { .flow-detail { grid-template-columns: 1fr; gap: 32px; } }
        .fdet-col h4 {
          font-family: var(--mono);
          font-size: 11px;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          color: var(--ink-faint);
          margin-bottom: 18px;
        }
        .fdet-col ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .fdet-col li { font-family: var(--serif); font-size: 16.5px; color: var(--ink); padding-left: 18px; position: relative; }
        .fdet-col li::before { content: "·"; position: absolute; left: 4px; color: var(--accent); font-weight: 700; }
        .fdet-note { font-family: var(--serif); font-style: italic; font-size: 14.5px; color: var(--ink-faint); margin-top: 18px; padding-top: 16px; border-top: 0.5px solid var(--rule); }
      `}</style>
    </section>

    {/* Local-first technical */}
    <SectionDivider eyebrow="Wo dein Werk liegt" title="Auf deiner Platte. Nicht in der Cloud." />

    <section className="files container-narrow">
      <p className="files-intro">Ein Verve-Werk ist ein einziger Ordner. Du kannst ihn kopieren, sichern, in Time Machine ablegen oder löschen. Verve hat keinen Zugriff darauf, wenn die App geschlossen ist.</p>

      <div className="files-tree">
        <div className="ft-row ft-folder"><FolderIcon/> <span>~/Documents/Die Eiserne Stunde.verve/</span></div>
        <div className="ft-row ft-sub ft-folder"><FolderIcon/> <span>manuscript/</span><em>· Markdown-Dateien, eine pro Kapitel</em></div>
        <div className="ft-row ft-sub ft-folder"><FolderIcon/> <span>knowledge/</span><em>· Figuren, Orte, Zeitlinien als JSON</em></div>
        <div className="ft-row ft-sub ft-folder"><FolderIcon/> <span>versions/</span><em>· lokale Git-Historie, jede Speicherung</em></div>
        <div className="ft-row ft-sub ft-folder"><FolderIcon/> <span>index/</span><em>· Vektor-Index für Wissens-Chat</em></div>
        <div className="ft-row ft-sub"><DocIcon/> <span>verve.toml</span><em>· deine Einstellungen für dieses Werk</em></div>
      </div>

      <p className="files-note">Markdown und JSON. Lesbar, ohne Verve. Migrations­fähig zu jedem anderen Tool. Wenn Verve morgen verschwindet, hast du immer noch dein Werk.</p>

      <style>{`
        .files { padding: 60px 0 100px; }
        .files-intro { font-family: var(--serif); font-weight: 300; font-size: 19px; color: var(--ink-dim); line-height: 1.55; max-width: 64ch; margin: 0 auto 40px; text-align: center; }
        .files-tree { background: var(--surface); border: 0.5px solid var(--rule); border-radius: 12px; padding: 24px 28px; font-family: var(--mono); font-size: 13.5px; line-height: 2; }
        .ft-row { display: flex; align-items: center; gap: 10px; color: var(--ink); }
        .ft-row em { color: var(--ink-faint); font-style: normal; font-size: 12px; margin-left: 8px; }
        .ft-sub { padding-left: 28px; }
        .ft-folder { color: var(--accent); }
        .ft-folder span { color: var(--ink); }
        .files-note { font-family: var(--serif); font-style: italic; font-size: 16.5px; color: var(--ink-dim); margin-top: 32px; text-align: center; max-width: 56ch; margin-left: auto; margin-right: auto; line-height: 1.55; }
      `}</style>
    </section>

    {/* Open source */}
    <section className="opn container-narrow">
      <div className="opn-grid">
        <div>
          <span className="eyebrow eyebrow-line">Quelloffen</span>
          <h2 className="opn-title">Vertrau uns nicht.<br/>Lies den Code.</h2>
        </div>
        <div className="opn-body">
          <p>Versprechen sind billig. Verve ist quelloffen unter der MIT-Lizenz — du kannst den vollständigen Quellcode auf GitHub einsehen, prüfen und kompilieren. Wenn wir behaupten, dass keine Telemetrie versendet wird, kannst du es im Code sehen. Wenn du uns nicht glaubst, kannst du Verve selbst bauen.</p>
          <p>Reproduzierbare Builds: Eine bestimmte Version von Verve ergibt — auf jedem Mac mit derselben Toolchain — denselben Hash. Was du installierst, ist das, was im Repo steht.</p>
          <div className="opn-cta">
            <a href="https://github.com/jahartmann/Verve" className="btn-ghost">
              <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 005.47 7.59c.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
              github.com/jahartmann/Verve
            </a>
            <a href="https://github.com/jahartmann/Verve/blob/main/LICENSE" className="btn-ghost">MIT-Lizenz</a>
          </div>
        </div>
      </div>
      <style>{`
        .opn { padding: 100px 0; }
        .opn-grid { display: grid; grid-template-columns: 1fr 1.4fr; gap: 64px; align-items: start; }
        @media (max-width: 720px) { .opn-grid { grid-template-columns: 1fr; gap: 32px; } }
        .opn-title { font-family: var(--serif); font-weight: 500; font-size: clamp(36px, 4.5vw, 56px); line-height: 1.05; letter-spacing: -0.03em; margin-top: 18px; }
        .opn-body p { font-family: var(--serif); font-weight: 300; font-size: 18px; line-height: 1.6; color: var(--ink-dim); margin-bottom: 18px; }
        .opn-cta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 24px; }
      `}</style>
    </section>

    {/* FAQ */}
    <SectionDivider eyebrow="Häufige Fragen" title="Im Klartext." />

    <section className="faq container-narrow">
      <Faq q="Wenn ich Cloud-KI einschalte — was geht dann ins Internet?">
        Bei einer Wissens-Chat-Frage durchsucht Verve <em>lokal</em> deinen Index nach den fünf bis zwölf relevantesten Belegstellen — typischerweise einzelne Absätze. Diese Stellen, deine Frage und ein System-Prompt gehen an den Cloud-Anbieter. Der Rest deines Manuskripts bleibt zuhause.
      </Faq>
      <Faq q="Trainieren Anbieter wie Anthropic oder OpenAI auf meinen Daten?">
        Anthropic, OpenAI, Mistral und Groq versprechen vertraglich, API-Anfragen nicht zu trainieren. Wir können das nicht beweisen — aber wir verlinken die Datenschutz-Seiten der Anbieter direkt im Modell-Auswahlmenü, sodass du jeweils die aktuelle Zusicherung nachlesen kannst. Wenn dir das zu unsicher ist: Lokal-Modelle gibt es nicht ohne Grund.
      </Faq>
      <Faq q="Wo speichert Verve mein Werk?">
        Standardmäßig in <code>~/Documents/</code>. Du kannst frei wählen — Time Machine, externe Platte, iCloud Drive (wenn du das willst), oder ein verschlüsselter Container. Verve benutzt nur die Standard-Dateisystem-APIs, keine eigene Cloud.
      </Faq>
      <Faq q="Was passiert mit meinem Werk, wenn Verve eingestellt wird?">
        Du behältst deinen Werk-Ordner. Manuskript als Markdown, Werk-Wissen als JSON, Versions-Historie als Git-Repository. Alles in offenen Formaten. Du kannst zu jedem anderen Tool migrieren — oder deine eigene Werkzeugkette bauen.
      </Faq>
      <Faq q="Kann ich Verve hinter einer Firewall ohne Internet nutzen?">
        Ja — vollständig. Schalte Cloud-KI in den Einstellungen aus, und Verve fragt das Internet nie wieder. Update-Prüfung lässt sich ebenfalls deaktivieren.
      </Faq>
      <Faq q="Was ist mit iCloud-Sync?">
        Verve hat keine eigene Sync-Funktion. Wenn du dein Werk in iCloud Drive ablegst, synchronisiert macOS es — wie jeden anderen Ordner. Das ist deine Entscheidung, nicht unsere.
      </Faq>
    </section>

    {/* CTA */}
    <section className="dl-section">
      <div className="container-narrow">
        <span className="eyebrow eyebrow-line">Bereit?</span>
        <h2 className="dl-title">Eine ruhige App.<br/>Eine ruhige Datenpolitik.</h2>
        <div className="dl-buttons">
          <a href="index.html#download" className="btn-primary">Verve laden · macOS</a>
          <a href="https://github.com/jahartmann/Verve" className="btn-ghost">Quellcode prüfen →</a>
        </div>
      </div>
    </section>

    <SiteFooter />

    <TweaksPanel title="Tweaks">
      <TweakSection title="Erscheinungsbild">
        <TweakRadio label="Modus" value={tweaks.theme} options={[{value:"dark",label:"Dunkel"},{value:"light",label:"Hell"}]} onChange={v => setTweak("theme", v)} />
        <TweakSelect label="Akzentfarbe" value={tweaks.accent} options={Object.entries(ACCENTS_SITE).map(([k,v]) => ({value:k,label:v.name}))} onChange={v => setTweak("accent", v)} />
      </TweakSection>
    </TweaksPanel>

    <style>{`
      .pill { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 80px 32px; }
      @media (max-width: 720px) { .pill { grid-template-columns: 1fr; } }

      .dl-section { padding: 100px 0 80px; text-align: center; border-top: 0.5px solid var(--rule); }
      .dl-title { font-family: var(--serif); font-weight: 500; font-size: clamp(40px, 6vw, 68px); line-height: 1.05; letter-spacing: -0.03em; margin: 18px 0; }
      .dl-buttons { display: flex; gap: 12px; justify-content: center; margin-top: 32px; flex-wrap: wrap; }
    `}</style>
  </>);
}

function PillCard({ title, body }) {
  return (
    <article className="plc">
      <h3>{title}</h3>
      <p>{body}</p>
      <style>{`
        .plc { padding: 36px 32px; background: var(--surface); border: 0.5px solid var(--rule); border-radius: 14px; }
        .plc h3 { font-family: var(--serif); font-weight: 500; font-size: 26px; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 14px; color: var(--ink); }
        .plc p { font-family: var(--serif); font-weight: 300; font-size: 16px; color: var(--ink-dim); line-height: 1.55; }
      `}</style>
    </article>
  );
}

function FlowNode({ title, sub, status, highlight }) {
  return (
    <div className={"fnode " + (highlight ? "fnode-h" : "")}>
      <div className="fnode-status">{status}</div>
      <div className="fnode-title">{title}</div>
      <div className="fnode-sub">{sub}</div>
      <style>{`
        .fnode { padding: 32px 28px; border: 0.5px solid var(--rule); border-radius: 14px; background: var(--surface); }
        .fnode-h { border-color: var(--accent); box-shadow: 0 0 0 0.5px var(--accent), 0 12px 40px -12px color-mix(in srgb, var(--accent) 40%, transparent); }
        .fnode-status { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 12px; }
        .fnode-h .fnode-status { color: var(--accent); }
        .fnode-title { font-family: var(--serif); font-size: 28px; font-weight: 500; letter-spacing: -0.02em; margin-bottom: 8px; }
        .fnode-sub { font-size: 13.5px; color: var(--ink-dim); line-height: 1.5; }
      `}</style>
    </div>
  );
}

function FlowArrow({ label }) {
  return (
    <div className="farr">
      <svg width="80" height="20" viewBox="0 0 80 20" fill="none">
        <path d="M0 10 H72" stroke="currentColor" strokeWidth="1" strokeDasharray="3 3"/>
        <path d="M68 5 L74 10 L68 15" stroke="currentColor" strokeWidth="1" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
      </svg>
      <div className="farr-lbl">{label}</div>
      <style>{`
        .farr { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--ink-faint); }
        .farr-lbl { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); max-width: 100px; text-align: center; line-height: 1.4; }
        @media (max-width: 720px) { .farr svg { transform: rotate(90deg); } }
      `}</style>
    </div>
  );
}

function FolderIcon() {
  return <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.4"><path d="M2 4h4l1 1h7v9H2V4z"/></svg>;
}
function DocIcon() {
  return <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.4"><path d="M4 1h6l3 3v11H4V1z"/></svg>;
}

function SectionDivider({ eyebrow, title }) {
  return (
    <section className="sect-div">
      <div className="container-narrow">
        <span className="eyebrow eyebrow-line">{eyebrow}</span>
        <h2>{title}</h2>
      </div>
      <style>{`
        .sect-div { padding: 100px 0 24px; text-align: center; }
        .sect-div h2 { font-family: var(--serif); font-weight: 500; font-size: clamp(40px, 6vw, 64px); line-height: 1.0; letter-spacing: -0.03em; margin-top: 18px; }
      `}</style>
    </section>
  );
}

function Faq({ q, children }) {
  const [open, setOpen] = React.useState(false);
  return (
    <div className={"faq-row " + (open ? "faq-open" : "")}>
      <button className="faq-q" onClick={() => setOpen(o => !o)}>
        <span>{q}</span>
        <span className="faq-chev">{open ? "−" : "+"}</span>
      </button>
      {open && <div className="faq-a">{children}</div>}
      <style>{`
        .faq-row { border-bottom: 0.5px solid var(--rule); }
        .faq-row:first-child { border-top: 0.5px solid var(--rule); }
        .faq-q {
          width: 100%; text-align: left;
          background: transparent; border: 0;
          padding: 24px 0;
          font-family: var(--serif); font-size: 19px; font-weight: 500;
          color: var(--ink);
          cursor: pointer;
          display: flex; justify-content: space-between; align-items: center;
          gap: 24px;
          letter-spacing: -0.01em;
        }
        .faq-chev { color: var(--accent); font-size: 24px; font-weight: 300; }
        .faq-a {
          padding: 0 0 24px;
          font-family: var(--serif); font-weight: 300; font-size: 17px;
          color: var(--ink-dim); line-height: 1.6;
          max-width: 64ch;
        }
        .faq-a code { font-family: var(--mono); font-size: 14px; background: var(--surface-2); padding: 2px 6px; border-radius: 3px; color: var(--ink); }
        .faq-a em { color: var(--ink); font-style: italic; }
      `}</style>
    </div>
  );
}

function waitAndMount() {
  if (!window.SiteNav || !window.SiteFooter || !window.useTweaks) {
    return setTimeout(waitAndMount, 30);
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<DatenschutzPage />);
}
waitAndMount();
</script>
</body>
</html>
